<style>
/* Same roles as the site, mapped onto the brand tokens in /brand.css. */
:root{
  --surface:var(--off-white);
  --ink:var(--bark);
  --ink-soft:var(--bark-soft);
  --accent-rgb:var(--browned-sugar-rgb);
}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:calc(74px + 2rem) 1rem 2rem;background:var(--surface);color:var(--ink);font-family:var(--font-body);font-weight:300;line-height:1.6;text-align:center}
/* The same solid Natural bar as the site. The logomark link is padded by
   its protection area (cap height of the "D"). */
.bar{position:fixed;inset:0 0 auto 0;z-index:10;display:flex;align-items:center;justify-content:space-between;min-height:74px;padding:0 max(4vw,1rem);background:var(--natural);border-bottom:1px solid rgb(var(--bark-rgb)/.1);--logo-ink:var(--bark);--logo-accent:var(--browned-sugar)}
.bar__home{display:flex;--logo-h:26px;padding:calc(var(--logo-h) * var(--clear-mark));margin-left:calc(-1 * min(calc(var(--logo-h) * var(--clear-mark)),max(4vw,1rem)))}
.bar__call{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;color:var(--bark);font-weight:500;text-decoration:none;border-bottom:1px solid rgb(var(--bark-rgb)/.35)}
/* The stacked logo, on its protection area, over a page that is a square-ish block. */
.mark{display:flex;justify-content:center;--logo-h:clamp(80px,12vw,112px);margin-bottom:.5rem}
.mark .logo{padding:calc(var(--logo-h) * var(--clear-stacked));box-sizing:content-box}
h1{font-family:var(--font-title);font-weight:500;font-size:clamp(2rem,5vw,3.4rem);line-height:1.02;letter-spacing:-.02em;margin:0 0 1rem}
h1 em{font-family:var(--font-accent);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--courtyard)}
p{margin:0 0 2rem;color:var(--ink-soft);max-width:38ch;margin-inline:auto}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:.8rem 1.6rem;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:.95rem 1.9rem;border-radius:999px;background:var(--courtyard);color:var(--off-white);font-weight:600;text-decoration:none}
.btn:hover{background:var(--courtyard-deep)}
.link{display:inline-flex;align-items:center;min-height:44px;color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid rgb(var(--accent-rgb)/.6)}
</style>

<script>
(function () {
  var c = window.DD_CONFIG || {}, o = document.getElementById('orderLink'), call = document.getElementById('callLink');
  var url = (c.TOAST_PICKUP_URL || c.TOAST_ORDER_URL || '').replace(/^\s+|\s+$/g, '');
  if (o) {
    o.setAttribute('href', url || '/#order');
    o.textContent = (c.COPY && c.COPY.pickupCta) || o.textContent;
    o.addEventListener('click', function () { if (window.DD && DD.track) DD.track('order_click', { mode: 'pickup', place: '404', live: !!url }); });
  }
  if (call && c.PHONE) { call.setAttribute('href', 'tel:' + c.PHONE.tel); call.textContent = 'Call ' + c.PHONE.display; }
  var barCall = document.querySelector('[data-bar-call]');
  if (barCall && c.PHONE) barCall.setAttribute('href', 'tel:' + c.PHONE.tel);
  var dir = document.getElementById('dirLink');
  if (dir && c.LINKS && c.LINKS.directions) dir.setAttribute('href', c.LINKS.directions);
})();
