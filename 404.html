<meta property="og:image:alt" content="The Dubai and Dips room: a gold DUBAI & DIPS sign on a deep green wall above lit pastry cases, marble tables and white chairs.">

<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
@font-face{font-family:'Fraunces';font-style:normal;font-weight:400 700;font-display:swap;src:url(/assets/fonts/fraunces-2.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-style:normal;font-weight:300 600;font-display:swap;src:url(/assets/fonts/sourcesans-2.woff2) format('woff2')}
/* Same tokens as the site. Standalone file, so the palette is repeated
   here rather than shared - the values are the only hex in the file. */
:root{
  --surface:#f2ede4;
  --ink:#1c3628;
  --ink-soft:#3d5a48;
  --accent:#b08d4a;
  --accent-bright:#d9bb7c;
  --accent-ink:#6d5415;
  --accent-rgb:176 141 74;
  --shade-rgb:74 54 32;
  --lift-1:0 1px 2px rgb(var(--shade-rgb)/.05),0 3px 10px rgb(var(--shade-rgb)/.07);
}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:2rem 1rem;background:var(--surface);color:var(--ink);font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.6;text-align:center}
.mark{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:.09em;color:var(--accent-ink);margin-bottom:2.5rem}
.mark i{font-style:normal;color:var(--accent)}
h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:clamp(2rem,5vw,3.4rem);line-height:1.02;letter-spacing:-.02em;margin:0 0 1rem}
h1 em{font-style:italic;font-weight:400;color:var(--accent-ink)}
p{margin:0 0 2rem;color:var(--ink-soft);max-width:38ch;margin-inline:auto}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:.8rem 1.6rem;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:.95rem 1.9rem;border-radius:999px;background:var(--accent-bright);color:var(--ink);font-weight:600;text-decoration:none;box-shadow:var(--lift-1)}
.link{display:inline-flex;align-items:center;min-height:44px;color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid rgb(var(--accent-rgb)/.6)}
</style>
</head>
<body>
<main>
  <div class="mark">DUBAI <i>&amp;</i> DIPS</div>
  <h1>That page is not in <em>the case.</em></h1>
  <p>The link may be old, or it was typed wrong. Everything we make is on the home page.</p>
  <div class="row">
    <a class="btn" id="orderLink" href="/#order" data-order="pickup" data-place="404">Order ahead for pickup</a>
    <a class="link" href="/">Back to the shop</a>
    <a class="link" id="callLink" href="tel:+12815550147">Call (281) 555-0147</a>
    <a class="link" href="https://maps.google.com/?q=Dubai+and+Dips+Clear+Lake+Houston+TX">Get directions</a>
  </div>
</main>
<!-- Same rule as everywhere else: the order button reads config and is
     never a dead link. Without a Toast URL it goes to the site's own
     ordering section, which carries the phone and the hours. -->
<script src="/config/ordering.js"></script>
<script src="/track.js"></script>
<script>
(function () {
  var c = window.DD_CONFIG || {}, o = document.getElementById('orderLink'), call = document.getElementById('callLink');
  var url = (c.TOAST_PICKUP_URL || c.TOAST_ORDER_URL || '').replace(/^\s+|\s+$/g, '');
  if (o) {
    o.setAttribute('href', url || '/#order');
    o.textContent = (c.COPY && c.COPY.pickupCta) || o.textContent;
    o.addEventListener('click', function () { if (window.DD && DD.track) DD.track('order_click', { mode: 'pickup', place: '404', live: !!url }); });
  }
  if (call && c.PHONE) { call.setAttribute('href', 'tel:' + c.PHONE.tel); call.textContent = 'Call ' + c.PHONE.display; }
})();
</script>
</body>
</html>
